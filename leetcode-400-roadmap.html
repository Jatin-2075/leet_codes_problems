<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>400 Grind — LeetCode Roadmap</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f4f1ea;
      --card: #fffdf8;
      --ink: #141414;
      --mute: #6b675e;
      --line: #dcd6c8;
      --g: #2e9e5b;
      --r: #d64545;
      --o: #f08a24;
      --y: #f2c230
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c0c0c;
        --card: #171717;
        --ink: #f1eee6;
        --mute: #9a968b;
        --line: #2b2b2b
      }
    }

    :root[data-theme="dark"] {
      --bg: #0c0c0c;
      --card: #171717;
      --ink: #f1eee6;
      --mute: #9a968b;
      --line: #2b2b2b
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif
    }

    .w {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    h1 {
      font-size: 28px;
      margin: 0;
      letter-spacing: -.5px
    }

    h1 b {
      color: var(--g)
    }

    .btn {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font: inherit
    }

    .btn.on {
      background: var(--ink);
      color: var(--bg)
    }

    .hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 22px;
      align-items: center;
      background: #111;
      color: #f4f1ea;
      border: 1px solid #2b2b2b;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0
    }

    .ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--g) calc(var(--p)*1%), #333 0)
    }

    .ring i {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #111;
      display: grid;
      place-items: center;
      font: 700 28px system-ui
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 10px
    }

    .st {
      border-left: 4px solid #f4f1ea;
      padding-left: 8px
    }

    .st b {
      font-size: 22px;
      display: block;
      line-height: 1.2
    }

    .st span {
      font-size: 12px;
      opacity: .7
    }

    .st.s {
      border-color: var(--g)
    }

    .st.r {
      border-color: var(--y)
    }

    .st.k {
      border-color: var(--o)
    }

    .st.w {
      border-color: var(--r)
    }

    .m2 {
      margin: 14px 0 0;
      font-size: 13px;
      opacity: .85
    }

    .m2 input {
      width: 52px;
      background: #222;
      color: #f4f1ea;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 2px 6px;
      font: inherit
    }

    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 9px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--g)
    }

    .m {
      color: var(--mute);
      font-size: 13px;
      margin: 6px 0 0
    }

    .q,
    details {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 10px 0
    }

    .q {
      border-top: 4px solid var(--o)
    }

    h2 {
      font-size: 15px;
      margin: 0 0 4px
    }

    summary {
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      list-style: none
    }

    summary::-webkit-details-marker {
      display: none
    }

    summary .bar {
      grid-column: 1/-1
    }

    summary em {
      color: var(--mute);
      font-style: normal
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 0 2px
    }

    .c {
      border: 1px solid var(--line);
      border-left: 5px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      background: var(--card);
      user-select: none;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .c a {
      color: var(--mute);
      text-decoration: none
    }

    .c.s {
      border-left-color: var(--g);
      background: color-mix(in srgb, var(--g) 15%, var(--card))
    }

    .c.r {
      border-left-color: var(--y);
      background: color-mix(in srgb, var(--y) 20%, var(--card))
    }

    .c.k {
      border-left-color: var(--o);
      background: color-mix(in srgb, var(--o) 20%, var(--card))
    }

    .c.w {
      border-left-color: var(--r);
      background: color-mix(in srgb, var(--r) 18%, var(--card))
    }

    .f {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0 4px
    }

    textarea {
      width: 100%;
      height: 110px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      font: 12px monospace;
      margin: 8px 0
    }

    @media(max-width:560px) {
      .hero {
        grid-template-columns: 1fr;
        justify-items: center
      }

      .stats {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <div class="w">
    <header>
      <h1>400 <b>Grind</b></h1><button class="btn" id="th">◐ Theme</button>
    </header>
    <div id="app"></div>
    <details>
      <summary><b>Import history / backup</b><em>data</em></summary>
      <p class="m">Paste your LeetCode submissions list to fill titles and mark solved problems, or paste a JSON backup
        to restore. Progress is saved in this browser (localStorage).</p>
      <textarea id="box" placeholder="Paste here…"></textarea>
      <button class="btn" id="imp">Import</button> <button class="btn" id="exp">Export JSON</button> <button class="btn"
        id="rst">Reset</button> <span class="m" id="msg"></span>
    </details>
  </div>

  <!-- DATA: a bare number = already solved in your history; [id,"Title"] = new; third item "w" = attempted, wrong -->

{"phases":[

{"name":"Greedy & Intervals","goal":"Sort, sweep, local choices","p":[55,45,455,860,56,[435,"Non-overlapping Intervals"],[57,"Insert Interval"],[452,"Minimum Number of Arrows to Burst Balloons"],[763,"Partition Labels"],[134,"Gas Station"],[135,"Candy"],[406,"Queue Reconstruction by Height"],[986,"Interval List Intersections"],[1288,"Remove Covered Intervals"],[646,"Maximum Length of Pair Chain"],[605,"Can Place Flowers"],[376,"Wiggle Subsequence"],[1094,"Car Pooling"],[738,"Monotone Increasing Digits"],[1029,"Two City Scheduling"],[561,"Array Partition"]]},
{"name":"Tries, Design & Advanced","goal":"Prefix trees, data-structure design, segment/BIT ideas","p":[212,4,[208,"Implement Trie"],[211,"Design Add and Search Words Data Structure"],[648,"Replace Words"],[677,"Map Sum Pairs"],[1268,"Search Suggestions System"],[421,"Maximum XOR of Two Numbers in an Array"],[460,"LFU Cache"],[705,"Design HashSet"],[706,"Design HashMap"],[622,"Design Circular Queue"],[1146,"Snapshot Array"],[1472,"Design Browser History"],[307,"Range Sum Query - Mutable"],[315,"Count of Smaller Numbers After Self"]]}

</script>

  <script>
    const $ = s => document.querySelector(s);
    const E = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const ST = ['', 's', 'r', 'k', 'w'], LB = { '': 'Todo', s: 'Solved', r: 'Review', k: 'Stuck', w: 'Wrong' };
    let S; try { S = JSON.parse(localStorage.getItem('lc400')) } catch (e) { }
    S = Object.assign({ st: {}, t: {}, sl: {}, df: {}, d: {}, pace: 4, th: '' }, S || {});
    const save = () => { try { localStorage.setItem('lc400', JSON.stringify(S)) } catch (e) { } };
    const D = JSON.parse($('#data').textContent), O = {};
    D.phases.forEach(p => p.it = p.p.map(x => Array.isArray(x) ? { id: x[0], t: x[1], s: x[2] } : { id: x, s: 's' }));
    const all = D.phases.flatMap(p => p.it);
    all.forEach(i => { if (S.st[i.id] === undefined && i.s) S.st[i.id] = i.s });
    if (S.th) document.documentElement.dataset.theme = S.th;
    const g = i => S.st[i.id] || '', ymd = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const url = i => S.sl[i.id] ? `https://leetcode.com/problems/${S.sl[i.id]}/` : `https://leetcode.com/problemset/?search=${i.id}`;
    const chip = i => `<div class="c ${g(i)}" data-id="${i.id}" title="${LB[g(i)]} — click to change status"><span>#${i.id} ${E(S.t[i.id] || i.t || '')}</span><a href="${url(i)}" target="_blank" rel="noopener">↗</a></div>`;
    let F = 'all';
    function render() {
      const n = all.length, done = all.filter(i => g(i) === 's').length, c = k => all.filter(i => g(i) === k).length;
      const t = ymd(new Date()), ds = new Set(Object.values(S.d)); let sk = 0, d = new Date();
      if (!ds.has(t)) d.setDate(d.getDate() - 1);
      while (ds.has(ymd(d))) { sk++; d.setDate(d.getDate() - 1) }
      const left = n - done, days = Math.ceil(left / S.pace), fin = new Date(); fin.setDate(fin.getDate() + days);
      const cur = D.phases.findIndex(p => p.it.some(i => g(i) !== 's')), q = all.filter(i => !g(i)).slice(0, S.pace);
      const stats = [['s', 'Solved', done], ['r', 'Review', c('r')], ['k', 'Stuck', c('k')], ['w', 'Wrong', c('w')], ['t', 'Today', all.filter(i => S.d[i.id] === t).length], ['f', 'Streak', sk + 'd']];
      const fl = [['all', 'All'], ['', 'Todo'], ['s', 'Solved'], ['r', 'Review'], ['k', 'Stuck'], ['w', 'Wrong']];
      $('#app').innerHTML = `
<section class="hero"><div class="ring" style="--p:${done / n * 100}"><i>${Math.round(done / n * 100)}%</i></div>
<div><div class="stats">${stats.map(([k, l, v]) => `<div class="st ${k}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
<p class="m2">${done}/${n} done · ${left} left · <label>pace <input id="pace" type="number" min="1" value="${S.pace}"> per day</label> → about ${days} days (${fin.toDateString()})</p></div></section>
<div class="q"><h2>Today's queue</h2><div class="chips">${q.map(chip).join('') || '<span class="m">All done. Legend.</span>'}</div>
<p class="m">Click a chip to cycle: Todo → Solved (green) → Review (yellow) → Stuck (orange) → Wrong (red).</p></div>
<div class="f">${fl.map(([k, l]) => `<button class="btn ${F === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
${D.phases.map((p, x) => {
        const dn = p.it.filter(i => g(i) === 's').length, pc = Math.round(dn / p.it.length * 100);
        if (O[x] === undefined) O[x] = x === cur;
        const list = p.it.filter(i => F === 'all' || g(i) === F);
        return `<details data-x="${x}" ${O[x] ? 'open' : ''}><summary><b>${x + 1}. ${p.name}</b><em>${dn}/${p.it.length}</em><div class="bar"><i style="width:${pc}%"></i></div></summary><p class="m">${p.goal}</p><div class="chips">${list.map(chip).join('') || '<span class="m">Nothing here</span>'}</div></details>`
      }).join('')}`;
    }
    const app = $('#app');
    app.addEventListener('click', e => {
      const f = e.target.closest('[data-f]'); if (f) { F = f.dataset.f; render(); return }
      const c = e.target.closest('.c'); if (!c || e.target.closest('a')) return;
      const id = c.dataset.id, i = all.find(z => z.id == id), nx = ST[(ST.indexOf(g(i)) + 1) % 5];
      S.st[id] = nx; if (nx === 's') S.d[id] = ymd(new Date()); else delete S.d[id];
      save(); render();
    });
    app.addEventListener('change', e => { if (e.target.id === 'pace') { S.pace = Math.max(1, parseInt(e.target.value) || 1); save(); render() } });
    app.addEventListener('toggle', e => { O[e.target.dataset.x] = e.target.open }, true);
    $('#th').onclick = () => { const dk = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches); S.th = dk ? 'light' : 'dark'; document.documentElement.dataset.theme = S.th; save() };
    const msg = t => $('#msg').textContent = t;
    $('#imp').onclick = () => {
      const v = $('#box').value.trim(); if (!v) return;
      if (v[0] === '{') { try { S = Object.assign(S, JSON.parse(v)); msg('Backup restored.') } catch (e) { return msg('That JSON is not valid.') } }
      else {
        const re = /\[(\d+)\.\s*([^\]]+)\]\(https:\/\/leetcode\.com\/problems\/([^\/]+)\/\)\s*(Easy|Med\.|Hard)\s*(\S[^\n]*)/g; let m, k = 0;
        while (m = re.exec(v)) {
          const [, id, t, sl, df, r] = m, s = S.st[id]; k++; S.t[id] = t; S.sl[id] = sl; S.df[id] = df;
          if (/Accepted/.test(r)) S.st[id] = (s === 'r' || s === 'k') ? s : 's'; else if (!s) S.st[id] = 'w'
        }
        msg(k + ' submissions read.');
      }
      save(); render();
    };
    $('#exp').onclick = () => { $('#box').value = JSON.stringify(S); msg('Copy this text as your backup.') };
    let rs = 0; $('#rst').onclick = () => { if (!rs) { rs = 1; msg('Click Reset again to wipe all progress.'); return } try { localStorage.removeItem('lc400') } catch (e) { } location.reload() };
    render();
  </script>
</body>

</html>
